<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" style="background:#000000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Black background -->
  <rect width="680" height="340" fill="#000000"/>

  <!-- Front face -->
  <polygon points="160,120 400,120 400,280 160,280" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
  <!-- Top face -->
  <polygon points="160,120 210,80 450,80 400,120" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
  <!-- Right face -->
  <polygon points="400,120 450,80 450,240 400,280" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>

  <!-- Front face horizontal slices -->
  <line x1="160" y1="173" x2="400" y2="173" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
  <line x1="160" y1="226" x2="400" y2="226" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Vertical slices dotted -->
  <line x1="280" y1="120" x2="280" y2="280" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="340" y1="120" x2="340" y2="280" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- chains axis -->
  <line x1="120" y1="280" x2="120" y2="120" stroke="rgba(255,255,255,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" x="60" y="205" text-anchor="middle">chains</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="60" y="222" text-anchor="middle">× 4</text>

  <!-- draws axis -->
  <line x1="160" y1="310" x2="400" y2="310" stroke="rgba(255,255,255,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" x="270" y="328" text-anchor="middle">draws</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="270" y="308" text-anchor="middle">× 1000</text>

  <!-- obs axis -->
  <line x1="400" y1="310" x2="455" y2="265" stroke="rgba(255,255,255,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" x="490" y="290" text-anchor="start">obs</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="490" y="307" text-anchor="start">× 352</text>

  <!-- Highlighted cell -->
  <rect x="280" y="120" width="60" height="53" fill="rgba(100,160,255,0.25)"/>
  <rect x="280" y="120" width="60" height="53" fill="none" stroke="rgba(100,160,255,0.7)" stroke-width="1"/>
  <text font-family="sans-serif" font-size="12" fill="#7eb8ff" x="310" y="150" text-anchor="middle">ỹᵢ⁽ˢ⁾</text>

  <!-- Right annotation -->
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="530" y="130" text-anchor="start">Cada celda =</text>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" x="530" y="148" text-anchor="start">una altura simulada</text>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" x="530" y="164" text-anchor="start">para la persona i</text>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" x="530" y="180" text-anchor="start">bajo los parámetros s</text>

  <!-- Shape label -->
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff" x="305" y="50" text-anchor="middle">(4, 1000, 352)</text>
  <text font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" x="305" y="66" text-anchor="middle">shape del tensor</text>
</svg>
